<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>音频频谱可视化</title>
  <style>
    canvas { display: block; background: #000; width: 100%; max-width: 800px; margin: 0 auto; }
    audio { display: block; width: 80%; margin: 20px auto; }
  </style>
</head>
<body>
  <audio id="audio" src="your-audio-file.mp3" controls></audio>
  <canvas id="visualizer" height="200"></canvas>‌‌:ml-citation{ref="7,8" appearance="aggregated" data="citationList"}

  <script>
    const audio = document.getElementById('audio');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');‌‌:ml-citation{ref="11,12" appearance="aggregated" data="citationList"}

    // 初始化 Web Audio API
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioContext = new AudioContext();
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = 256; // 频率分辨率（必须是2的幂）
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    // 连接音频源 → 分析器 → 扬声器
    const source = audioContext.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioContext.destination);

    // 绘制频谱函数
    function draw() {
      requestAnimationFrame(draw);
      analyser.getByteFrequencyData(dataArray);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const barWidth = canvas.width / bufferLength * 2.5;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;
        const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
        gradient.addColorStop(0, '#f00');
        gradient.addColorStop(0.5, '#ff0');
        gradient.addColorStop(1, '#0f0');
        ctx.fillStyle = gradient;
        ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 1;
      }
    }

    // 点击播放才启动（部分浏览器需用户交互才允许AudioContext）
    audio.addEventListener('play', () => {
      if (audioContext.state === 'suspended') audioContext.resume();
      draw();
    });
  </script>
</head>
